name: Actualizar observatorio meteorologico
on:
  workflow_dispatch:
  schedule:
    - cron: '7,27,47 * * * *'
permissions:
  contents: write
concurrency:
  group: observatorio-meteo
  cancel-in-progress: false
jobs:
  captura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capturar datos CHD
        id: captura
        continue-on-error: true
        run: python captura_saih.py
      - name: Publicar datos y diagnostico
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add datos/observaciones_chd.csv datos/estado.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar observaciones CHD'
            git push
          fi
      - name: Marcar fallo si la captura fallo
        if: steps.captura.outcome == 'failure'
        run: exit 1
