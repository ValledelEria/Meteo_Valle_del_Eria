name: Captura diaria SAIH Duero
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: captura-saih-main
  cancel-in-progress: false
jobs:
  captura:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobar codigo
        run: python -m unittest discover -s tests -v
      - name: Capturar las cuatro series
        id: captura
        continue-on-error: true
        run: python captura_saih.py
      - name: Guardar CSV y diagnostico
        run: |
          git config user.name 'meteo-bot'
          git config user.email 'meteo-bot@users.noreply.github.com'
          git add datos/
          if ! git diff --cached --quiet; then
            git commit -m "Captura SAIH $(date -u +%F)"
            git push
          fi
      - name: Notificar fallo de captura
        if: steps.captura.outcome == 'failure'
        run: |
          echo 'Fallo de captura SAIH: revisar datos/estado.json y los registros del workflow'
          exit 1
